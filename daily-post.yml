name: 毎日の健康ブログ自動更新

on:
  schedule:
    # 毎日 07:00 JST = 22:00 UTC(前日)に実行
    - cron: "0 22 * * *"
  workflow_dispatch: {} # 手動実行ボタンも使えるようにする

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Pythonをセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 記事を自動生成
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/generate_post.py

      - name: 生成した記事をコミット
        run: |
          git config user.name "health-blog-bot"
          git config user.email "actions@github.com"
          git add _posts
          git commit -m "自動生成: $(date +'%Y-%m-%d')の記事" || echo "変更なし"
          git push

      - name: Rubyをセットアップ
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"
          bundler-cache: true

      - name: Jekyllでビルド
        run: bundle exec jekyll build

      - name: GitHub Pagesの準備
        uses: actions/configure-pages@v5

      - name: ビルド結果をアップロード
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: GitHub Pagesにデプロイ
        id: deployment
        uses: actions/deploy-pages@v4
